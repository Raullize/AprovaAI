name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: npx eslint .

      - name: Build
        run: pnpm build

  backend:
    name: Backend (lint + unit + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npx eslint "src/**/*.ts" "test/**/*.ts"

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  backend-e2e:
    name: Backend E2E (functional)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aprovaai_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure test environment
        run: cp .env.test.example .env.test

      - name: Push Prisma schema
        run: >
          DATABASE_URL="postgresql://postgres:postgres@localhost:5434/aprovaai_test"
          npx prisma db push

      - name: Start API (background)
        run: |
          DATABASE_URL="postgresql://postgres:postgres@localhost:5434/aprovaai_test" \
          JWT_SECRET="your-super-secret-jwt-key-at-least-32-chars" \
          PORT=3001 \
          NODE_ENV=test \
          nohup npx nest start > /tmp/backend.log 2>&1 &

      - name: Run functional E2E suite (seed + jest + rollback)
        run: pnpm test:func